apiVersion: 1
datasources:
  - name: Postgres
    uid: pg
    type: grafana-postgresql-datasource
    url: db:5432
    user: mlops
    jsonData: {database: mlops, sslmode: disable, postgresVersion: 1600}
    secureJsonData: {password: mlops}
  - name: Prometheus
    uid: prom
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
