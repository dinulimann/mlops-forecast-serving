name: mlops
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: mlops, POSTGRES_PASSWORD: mlops, POSTGRES_DB: mlops}
    ports: ["127.0.0.1:5563:5432"]
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=64MB"]
    mem_limit: 768m
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlops"]
      interval: 3s
      retries: 20

  mlflow:
    build: .
    image: mlops-forecast:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "localhost:5050,127.0.0.1:5050,mlflow:5000,mlflow"
      --workers 1
    environment:
      # MLflow 3 starts ~7 background job workers (GenAI evaluation, ~170 MB each); not used here
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    mem_limit: 768m
    ports: ["127.0.0.1:5050:5000"]
    volumes: [mlflow:/mlflow]
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:5000/health"]
      interval: 5s
      retries: 30

  api:
    image: mlops-forecast:latest
    depends_on:
      db: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://mlops:mlops@db:5432/mlops
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MALLOC_ARENA_MAX: "2"   # each full-store request allocates ~1.2M rows; limits glibc fragmentation
    mem_limit: 1536m
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8000"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:8000/health"]
      interval: 5s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9095:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/forecast-quality.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3300:3000"]

volumes:
  db:
  mlflow:
